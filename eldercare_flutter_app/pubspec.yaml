name: eldercare_monitoring
description: ElderCare AI Mobile App - Real-time fall detection and activity monitoring alerts.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Core & Authentication
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  firebase_messaging: ^14.7.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.2.1
  
  # Web & HTTP
  webview_flutter: ^4.4.0
  http: ^1.1.0
  url_launcher: ^6.2.0
  
  # State management
  provider: ^6.1.0
  
  # UI/UX
  get: ^4.6.5
  intl: ^0.19.0
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Utilities
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
